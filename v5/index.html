  <!-- PostHog event wiring. Inline in the no-store apex HTML (no ?v= bump needed) and
       uses event delegation + observers, so it covers the rows app.js renders
       dynamically WITHOUT editing the ?v=-cached app.js. -->
  <script>
    (function () {
      function capture(name, props) {
        try { if (window.posthog && posthog.capture) posthog.capture(name, props || {}); } catch (e) {}
      }
      function sectionOf(el) {
        var s = el.closest && el.closest("section[id]");
        return s && s.id ? s.id : "drops";
      }
      function propFromHref(href) {
        var m = (href || "").match(/\/stay\/([a-z0-9-]+?)(?:-orp[a-z0-9]+)?(?:[\/?#]|$)/i);
        return m ? m[1] : null;
      }

      // 1) booking_intent — last signal before the visitor leaves to the booking engine.
      //    Booking rows are a.drop-row (carry data-property); "Next Available"/"Summer"
      //    rows are plain a[href^="/stay/"]. Capture phase = fires before navigation.
      document.addEventListener("click", function (e) {
        var a = e.target.closest && e.target.closest('a.drop-row, a[href^="/stay/"], a[href*="stay.reset.club"]');
        if (!a || a.classList.contains("drop-row-sold")) return;
        capture("booking_intent", {
          property: a.getAttribute("data-property") || propFromHref(a.getAttribute("href")),
          section: sectionOf(a)
        });
      }, true);

      // 2) viewed_property — fire once per property when its drop row is ≥50% in view.
      var seenProp = {};
      var pio = ("IntersectionObserver" in window) ? new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var prop = entry.target.getAttribute("data-property");
          if (prop && !seenProp[prop]) { seenProp[prop] = true; capture("viewed_property", { property: prop }); }
          pio.unobserve(entry.target);
        });
      }, { threshold: 0.5 }) : null;

      // 3) viewed_pricing — once, when a real (non-SOLD) rate scrolls into view.
      var pricingFired = false;
      var rio = ("IntersectionObserver" in window) ? new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (pricingFired || !entry.isIntersecting) return;
          var t = (entry.target.textContent || "").trim().toUpperCase();
          if (t && t !== "SOLD") { pricingFired = true; capture("viewed_pricing", { section: sectionOf(entry.target) }); }
          rio.unobserve(entry.target);
        });
      }, { threshold: 1.0 }) : null;

      function scan() {
        if (pio) document.querySelectorAll("a.drop-row[data-property]").forEach(function (r) {
          if (!r.__phP) { r.__phP = true; pio.observe(r); }
        });
        if (rio && !pricingFired) document.querySelectorAll(".drop-price").forEach(function (p) {
          if (!p.__phR) { p.__phR = true; rio.observe(p); }
        });
      }

      // 4) viewed_dates — user picks a timeframe/availability option in the hero nav.
      document.addEventListener("click", function (e) {
        var opt = e.target.closest && e.target.closest("a.hero-option");
        if (opt) {
          var label = opt.querySelector(".hero-option-label");
          capture("viewed_dates", { option: label ? label.textContent.trim() : (opt.textContent || "").trim().slice(0, 40) });
        }
      });

      // app.js builds #main dynamically — re-scan as rows/prices appear.
      var main = document.getElementById("main");
      if (main && "MutationObserver" in window) {
        new MutationObserver(function () { scan(); }).observe(main, { childList: true, subtree: true });
      }
      document.addEventListener("DOMContentLoaded", scan);
      scan();
    })();
  </script>
